<div>
	<div id="BranchPanel" class="panel right"></div>
	<div id="CommitPanel" class="panel left"></div>
	<div class="center-panel">
		<button id="Refresh" onclick="refresh()">Refresh</button>
		<input id="CommitMessage" placeholder="Enter commit message">
		<button id="CommitChanges" onclick="commitGitChanges()">Commit Changes</button>
		<button id="PushButton" onclick="pushGitChanges()">Push Changes</button>
		<button id="PullChanges" onclick="pullGitChanges()">Pull Changes</button>
	    <button id="PickFolder" onclick="pickFolder()">Pick Folder</button>
		<input id="BranchNameInput" placeholder="Enter branch name">
		<button id="SwitchBranch" onclick="switchGitBranch()">Switch Branch</button>
		<div id="Result"></div>
		<div id="Changes"></div>
	</div>
</div>
